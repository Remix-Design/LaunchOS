name: Sync README version

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: write

jobs:
  sync-readme-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Sync README version
        run: node scripts/sync-readme-version.mjs

      - name: Commit README changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Sync README version
          file_pattern: README.md README_CN.md README_TW.md README_JA.md
